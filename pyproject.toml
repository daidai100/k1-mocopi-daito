[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "k1-motion"
version = "0.1.0"
description = "Causal human motion references and whole-body K1 controller development"
requires-python = ">=3.11,<3.13"
dependencies = ["numpy>=1.26,<2", "scipy>=1.11", "mujoco==3.10.0"]

[project.optional-dependencies]
train = ["torch>=2.6"]
warp = ["torch>=2.6", "mujoco-warp==3.11.0", "warp-lang==1.17.0"]
logs = ["mcap>=1.2", "mcap-ros2-support>=0.5"]
test = ["pytest>=8", "ruff>=0.11"]

[project.scripts]
k1-motion = "k1_motion.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
k1_motion = ["native/*.cpp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
